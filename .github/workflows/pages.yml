# Publishes docs/ (the project page) to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  # Every push to main redeploys (takes ~30s). No path filter: path filters
  # can skip the very first push of a repository, which left the site at 404.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
