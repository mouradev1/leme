<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defense in depth: the UI may only load code/assets from the app itself and
      may not open connections anywhere (cluster traffic goes through Go, never
      the webview). Even a compromised dependency can't exfiltrate data or pull
      remote scripts. wails: = macOS/Linux origin, http://wails.localhost =
      Windows origin, ws://localhost:* = Vite HMR in `wails dev` only.
      'unsafe-inline' is for styles only (Vue :style bindings, Monaco/xterm CSS).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' wails: http://wails.localhost;
               script-src 'self' wails: http://wails.localhost;
               style-src 'self' wails: http://wails.localhost 'unsafe-inline';
               img-src 'self' wails: http://wails.localhost data: blob:;
               font-src 'self' wails: http://wails.localhost data:;
               connect-src 'self' wails: http://wails.localhost ws://localhost:*;
               worker-src 'self' wails: http://wails.localhost blob:;
               object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Leme</title>
    <style>
      /* Splash: plain HTML/CSS so it paints before any script; removed by main.ts. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #09090b;
        transition: opacity .35s ease, visibility .35s; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .box { display: grid; justify-items: center; gap: 14px; transform: translateY(-4%); }
      #splash img { width: 84px; height: 84px; animation: leme-in .7s cubic-bezier(.2,.8,.2,1) both, leme-glow 2.4s ease-in-out .7s infinite; }
      #splash .name { font: 600 22px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; color: #f4f4f5;
        letter-spacing: .02em; animation: leme-up .6s .15s ease-out both; }
      #splash .tag { font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; color: #71717a; animation: leme-up .6s .25s ease-out both; }
      #splash .bar { width: 120px; height: 2px; border-radius: 2px; background: #27272a; overflow: hidden; margin-top: 6px; animation: leme-up .6s .3s ease-out both; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #38bdf8;
        animation: leme-load 1.1s ease-in-out infinite; }
      @keyframes leme-in { from { opacity: 0; transform: scale(.82) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes leme-glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(56,189,248,0)); } 50% { filter: drop-shadow(0 0 14px rgba(56,189,248,.45)); } }
      @keyframes leme-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes leme-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation: none !important; } }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-200 antialiased">
    <div id="splash" aria-hidden="true">
      <div class="box">
        <img src="/logo.png" alt="" />
        <div class="name">Leme</div>
        <div class="tag">Kubernetes, sem peso.</div>
        <div class="bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
